<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agbor Kingdom — Admin Login</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <div class="admin-brand">

                <div class="admin-brand-title">
                    AGBOR KINGDOM
                </div>

                <div class="admin-brand-subtitle">
                    ADMINISTRATION
                </div>

            </div>


            <div class="admin-login-heading">

                <span class="admin-label">
                    SECURE ACCESS
                </span>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Sign in to manage the Royal Kingdom
                    of Agbor website.
                </p>

            </div>


            <form id="adminLoginForm">

                <div class="admin-form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    Sign In
                </button>


                <div
                    id="adminLoginMessage"
                    class="admin-login-message"
                ></div>

            </form>

        </div>

    </main>


    <!-- IMPORTANT:
         Supabase must load BEFORE admin-login.js
    -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-supabase.js"></script>

<script src="admin-login.js"></script>

</body>
</html>
